# =============================================================================
# Nginx — Mawgood Marketplace (Single unified config)
# /etc/nginx/sites-available/mawgood.cloud.conf
#
# SSL Certificate: /etc/letsencrypt/live/mawgood.cloud/
# Covers: mawgood.cloud, www.mawgood.cloud, api.mawgood.cloud,
#         admin.mawgood.cloud, vendor.mawgood.cloud
# =============================================================================

# ── 1. HTTP → HTTPS redirects ─────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name mawgood.cloud www.mawgood.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mawgood.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.mawgood.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name vendor.mawgood.cloud;
    return 301 https://$host$request_uri;
}

# ── 2. API — api.mawgood.cloud ────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mawgood.cloud;

    ssl_certificate     /etc/letsencrypt/live/mawgood.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mawgood.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/mawgood-web/backend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
    }
}

# ── 3. Storefront — mawgood.cloud ─────────────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mawgood.cloud www.mawgood.cloud;

    ssl_certificate     /etc/letsencrypt/live/mawgood.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mawgood.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # /api → Medusa backend (strips /api prefix)
    location /api/ {
        proxy_pass         http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── 4. Admin Panel — admin.mawgood.cloud ──────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mawgood.cloud;

    ssl_certificate     /etc/letsencrypt/live/mawgood.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mawgood.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mawgood-web/admin-panel/dist;
    index index.html;

    # /api → Medusa backend (strips /api prefix)
    location /api/ {
        proxy_pass         http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # SPA — serve static files, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # JS/CSS/fonts — long cache
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ── 5. Vendor Panel — vendor.mawgood.cloud ────────────────────────────────────

