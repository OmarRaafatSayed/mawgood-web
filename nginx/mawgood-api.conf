# =============================================================================
# Nginx — Backend API (Medusa v2)
# /etc/nginx/sites-available/mawgood-api
#
# Routes:
#   api.mawgood.cloud/          → Medusa backend :9000
#   api.mawgood.cloud/static/   → served directly from disk (no proxy overhead)
#
# Install:
#   sudo cp nginx/mawgood-api.conf /etc/nginx/sites-available/mawgood-api
#   sudo ln -sf /etc/nginx/sites-available/mawgood-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream medusa_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mawgood.cloud;

    # Redirect HTTP → HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;

    # ── Static files served directly ─────────────────────────────────────────
    location /static/ {
        alias /var/www/mawgood/backend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Medusa API ────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://medusa_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout  300s;

        # Buffer settings for large responses (product imports, etc.)
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
}

