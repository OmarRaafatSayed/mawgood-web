# =============================================================================
# Nginx — Storefront (Next.js 15 standalone)
# /etc/nginx/sites-available/mawgood-storefront
#
# Routes:
#   mawgood.cloud/          → Next.js standalone server :3000
#   mawgood.cloud/api/*     → Medusa backend :9000  (strips /api prefix)
#   mawgood.cloud/_next/*   → static assets with long-term cache
#
# The /api proxy block mirrors the Next.js rewrites() in next.config.ts.
# Both dev (Next.js rewrites) and production (Nginx proxy) behave identically.
# =============================================================================

upstream medusa_backend_storefront {
    server 127.0.0.1:9000;
    keepalive 16;
}

upstream nextjs_storefront {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mawgood.cloud www.mawgood.cloud;

    # return 301 https://$host$request_uri;

    # ── /api proxy — strips prefix, forwards to Medusa ───────────────────────
    location /api/ {
        proxy_pass         http://medusa_backend_storefront/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  120s;
        proxy_connect_timeout 30s;
    }

    # ── Next.js static assets — long-term cache ───────────────────────────────
    location /_next/static/ {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Next.js app ───────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://nextjs_storefront;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  60s;
        proxy_connect_timeout 30s;
    }
}

