# =============================================================================
# Nginx — Admin Panel (SPA)
# /etc/nginx/sites-available/mawgood-admin
#
# Routes:
#   admin.mawgood.cloud/        → static SPA served by `serve` on :5173
#   admin.mawgood.cloud/api/*   → Medusa backend :9000  (strips /api prefix)
#
# The /api proxy block is the KEY to the Reverse-Proxy Strategy:
#   - The admin-panel JS bundle always calls /api/...
#   - Nginx strips /api and forwards to the real backend
#   - The bundle never contains a hard-coded domain → portable across servers
# =============================================================================

upstream medusa_backend_admin {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.mawgood.cloud;

    # Redirect HTTP → HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;

    # ── /api proxy — strips prefix, forwards to Medusa ───────────────────────
    location /api/ {
        proxy_pass         http://medusa_backend_admin/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  120s;
        proxy_connect_timeout 30s;

        client_max_body_size 50M;
    }

    # ── SPA static files ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # SPA fallback — return index.html for all unknown routes
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        proxy_pass http://127.0.0.1:5173;
    }
}

